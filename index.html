<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Tris</title>
  <link rel="stylesheet" href="styles.css">

  <script>
    function showInfo() {
      alert("Benvenuto nel gioco del Tris!");
    }
  </script>
</head>

<body onload="showInfo()">

  <h1 id="title">Gioco del Tris</h1>

  <form id="settings">
    <label>
      Giocatore 1:
      <input type="text" id="player1"
        onfocus="this.style.background='lightyellow'"
        onblur="this.style.background='white'">
    </label>

    <label>
      Giocatore 2:
      <input type="text" id="player2">
    </label>

    <button type="button" id="startGame">Inizia Partita</button>

    <label>
      Cambia sfondo:
      <input type="color" id="bgColorPicker">
    </label>
  </form>

  <div id="game"></div>

  <p id="message"></p>

  <button id="restart">Ricomincia</button>

  <button id="toggleTitle"
    ondblclick="document.getElementById('title').style.color='red'">
    Cambia colore titolo (dblclick)
  </button>

  <button id="goHome">Torna alla Home</button>

  <select id="fontSizeSelect">
    <option value="16">Font 16px</option>
    <option value="20">Font 20px</option>
    <option value="24">Font 24px</option>
  </select>

  <br><br>

  <span id="hoverSpan">Passa sopra di me!</span>

  <script src="script.js"></script>
</body>
</html>
